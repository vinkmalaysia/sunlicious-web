<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-sun.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2e62b" />
    <meta
      name="description"
      content="Galeri produk Rasa Suria — rangkaian jus buah tropika 100% semula jadi dalam botol 500ml."
    />
    <title>Galeri Produk - SunLicious</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-sun-yellow font-sans text-sun-pine antialiased">
    <!-- Header/topnav is rendered by src/nav.ts into this slot -->
    <header id="site-header"></header>

    <main>
      <section
        class="relative overflow-hidden pb-28 pt-32 sm:pb-36 sm:pt-36"
        aria-labelledby="galeri-title"
      >
        <!-- LAYER ground -->
        <div
          class="absolute inset-0"
          style="
            background: radial-gradient(
              120% 90% at 28% 8%,
              #fdf9c8 0%,
              #f9ef6e 38%,
              #f2e62b 72%,
              #e9d81c 100%
            );
          "
          aria-hidden="true"
        ></div>

        <!-- LAYER decor: oversized foliage fading into the corners, never in
             front of content -->
        <div class="pointer-events-none absolute inset-0 select-none" aria-hidden="true">
          <picture>
            <source srcset="/layers-_0011_Layer-12.avif" type="image/avif" />
            <source srcset="/layers-_0011_Layer-12.webp" type="image/webp" />
            <img
              src="/layers-_0011_Layer-12.webp"
              alt=""
              width="488"
              height="396"
              class="absolute -top-24 -right-32 w-[26rem] rotate-[24deg] opacity-30 blur-[2px] saturate-[0.85] sm:-top-28 sm:-right-40 sm:w-[34rem]"
            />
          </picture>
          <picture>
            <source
              srcset="
                /layers-_0013_gpt-image-2.5-flare_create_webpage_decoration_elements_based_on_pineapple_fruit_juice_theme._natural-0-topa.avif
              "
              type="image/avif"
            />
            <source
              srcset="
                /layers-_0013_gpt-image-2.5-flare_create_webpage_decoration_elements_based_on_pineapple_fruit_juice_theme._natural-0-topa.webp
              "
              type="image/webp"
            />
            <img
              src="/layers-_0013_gpt-image-2.5-flare_create_webpage_decoration_elements_based_on_pineapple_fruit_juice_theme._natural-0-topa.webp"
              alt=""
              width="454"
              height="407"
              class="absolute -bottom-40 -left-36 w-[28rem] -rotate-[18deg] opacity-25 blur-[2px] saturate-[0.85] sm:-bottom-48 sm:-left-44 sm:w-[36rem]"
            />
          </picture>
          <picture>
            <source srcset="/layers-_0012_Layer-13.avif" type="image/avif" />
            <source srcset="/layers-_0012_Layer-13.webp" type="image/webp" />
            <img
              src="/layers-_0012_Layer-13.webp"
              alt=""
              width="376"
              height="372"
              class="absolute -bottom-24 right-[8%] w-[16rem] rotate-[68deg] opacity-20 blur-[3px] saturate-[0.8] sm:w-[20rem]"
            />
          </picture>
          <picture>
            <source srcset="/layers-_0010_Layer-11.avif" type="image/avif" />
            <source srcset="/layers-_0010_Layer-11.webp" type="image/webp" />
            <img
              src="/layers-_0010_Layer-11.webp"
              alt=""
              width="718"
              height="562"
              class="absolute -top-10 left-[16%] hidden w-[24rem] rotate-[12deg] opacity-[0.12] blur-[3px] saturate-[0.75] lg:block"
            />
          </picture>
        </div>

        <div class="relative z-10 mx-auto max-w-7xl px-5 sm:px-8">
          <div class="mb-12 max-w-2xl sm:mb-16">
            <h2
              id="galeri-title"
              class="text-balance font-display text-[clamp(2.75rem,5vw,4rem)] font-extrabold leading-[0.95] tracking-[-0.02em] text-sun-pine"
            >
              Galeri Produk
            </h2>
            <p class="mt-5 text-[16px] font-semibold leading-relaxed text-sun-pine/85 sm:text-lg">
              Rangkaian lengkap jus buah tropika kami — diperah daripada buah matang pilihan, tanpa
              gula tambahan, perisa tiruan atau pengawet.
            </p>
          </div>

          <!-- Cards are rendered by src/produk.ts into this list -->
          <ul
            id="produk-grid"
            class="grid grid-cols-1 gap-6 sm:grid-cols-2 sm:gap-7 lg:grid-cols-3"
            role="list"
          ></ul>
        </div>
      </section>
    </main>

    <!-- Footer is rendered by src/footer.ts into this slot -->
    <footer id="site-footer"></footer>

    <script type="module" src="/src/nav.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/footer.ts"></script>
    <script type="module" src="/src/produk.ts"></script>
  </body>
</html>
